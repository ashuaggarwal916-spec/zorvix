<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zorvix — Voice Agent</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #e0e5ec;
            --surface: #e0e5ec;
            --text: #2d3748;
            --text-muted: #718096;
            --primary: #6366f1;
            --accent: #f59e0b;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --radius: 20px;
            --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 120px; }
        
        /* Neumorphism */
        .neu { background: var(--surface); border-radius: var(--radius); box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); }
        .neu-sm { background: var(--surface); border-radius: var(--radius-sm); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); }
        .neu-press { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
        
        .header { padding: 24px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .brand-text h1 { font-size: 1.3rem; font-weight: 700; }
        .brand-text p { font-size: 0.75rem; color: var(--text-muted); }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 24px 24px; }
        .stat { padding: 20px 12px; text-align: center; }
        .stat-val { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }
        
        .section { padding: 0 24px 24px; }
        .section-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
        
        .lead { padding: 20px; margin-bottom: 16px; cursor: pointer; transition: all 0.2s; }
        .lead:active { transform: scale(0.98); }
        .lead-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .lead-name { font-weight: 600; font-size: 1rem; }
        .lead-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
        .lead-phone { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; }
        
        .badge { padding: 5px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .badge-pending { background: rgba(245,158,11,0.15); color: #d97706; }
        .badge-reached { background: rgba(34,197,94,0.15); color: #16a34a; }
        .badge-interested { background: rgba(34,197,94,0.25); color: #15803d; }
        .badge-calling { background: rgba(99,102,241,0.15); color: #4f46e5; }
        
        .lead-actions { display: flex; gap: 10px; }
        .btn { padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; text-decoration: none; }
        .btn:active { transform: scale(0.95); }
        .btn-wa { background: #25d366; color: white; }
        .btn-call { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-sm { padding: 10px 14px; font-size: 0.8rem; }
        
        .fab { position: fixed; bottom: 100px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); cursor: pointer; z-index: 100; }
        
        .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; padding: 14px 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); z-index: 100; }
        .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 500; }
        .nav a.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; }
        
        .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
        .modal-bg.show { display: flex; }
        .modal { background: var(--bg); border-radius: 28px 28px 0 0; padding: 28px; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; }
        .upload-zone { border: 3px dashed var(--text-muted); border-radius: var(--radius); padding: 50px 24px; text-align: center; cursor: pointer; opacity: 0.7; }
        .upload-zone:active { border-color: var(--primary); opacity: 1; }
        .upload-zone input { display: none; }
        .empty { text-align: center; padding: 70px 24px; color: var(--text-muted); }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #16a34a; color: white; padding: 14px 28px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 300; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err { background: #dc2626; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="brand">
                <div class="brand-icon neu-sm">🎙️</div>
                <div class="brand-text">
                    <h1>Zorvix</h1>
                    <p>AI Voice Agent</p>
                </div>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="connStatus">⚪ Connecting...</div>
        </div>

        <div class="stats">
            <div class="stat neu"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Leads</div></div>
            <div class="stat neu"><div class="stat-val" id="sPending">0</div><div class="stat-lbl">Pending</div></div>
            <div class="stat neu"><div class="stat-val" id="sInterested">0</div><div class="stat-lbl">Interested</div></div>
        </div>

        <div class="section">
            <div class="section-header">
                <span>Your Leads</span>
                <button class="btn btn-outline btn-sm" id="autoCallBtn">▶ Auto Call</button>
            </div>
            <div id="leadsList"></div>
        </div>
    </div>

    <div class="fab" id="fabBtn">+</div>

    <div class="nav neu">
        <a href="#" class="active"><span class="nav-icon">📞</span>Calls</a>
        <a href="#" onclick="openUpload(); return false;"><span class="nav-icon">➕</span>Add</a>
        <a href="#" onclick="exportReport(); return false;"><span class="nav-icon">📊</span>Reports</a>
        <a href="#" onclick="showSetup(); return false;"><span class="nav-icon">⚙️</span>Setup</a>
    </div>

    <div class="modal-bg" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Upload Leads</div>
                <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
            </div>
            <div class="upload-zone" onclick="document.getElementById('csvFile').click()">
                <input type="file" id="csvFile" accept=".csv" onchange="uploadCSV(event)">
                <div style="font-size: 3rem; margin-bottom: 14px;">📁</div>
                <p style="font-weight: 600; margin-bottom: 6px;">Tap to upload CSV</p>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Name, Phone, Business, City, Service</p>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="setupModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Setup</div>
                <button class="modal-close" onclick="closeModal('setupModal')">&times;</button>
            </div>
            <div id="setupBody">
                <div class="neu" style="padding: 20px; margin-bottom: 16px;">
                    <h3 style="margin-bottom: 10px; font-size: 1rem;">WhatsApp Connection</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">Connect WhatsApp for auto-messaging</p>
                    <div id="waStatus" style="padding: 14px; border-radius: 12px; margin-bottom: 12px; background: rgba(99,102,241,0.05);">
                        <p style="color: var(--text-muted); font-size: 0.85rem;">⏳ Waiting...</p>
                    </div>
                    <button class="btn btn-call" style="width: 100%; margin-bottom: 10px;" onclick="refreshQR()">🔄 Get QR Code</button>
                    <div id="qrContainer" style="text-align: center; display: none;">
                        <img id="qrImage" style="max-width: 200px; border-radius: 16px; border: 3px solid var(--primary);">
                    </div>
                </div>
                <div class="neu" style="padding: 20px;">
                    <h3 style="margin-bottom: 10px; font-size: 1rem;">Supabase</h3>
                    <input type="text" id="sbUrl" placeholder="Project URL" style="width:100%;padding:14px;background:var(--bg);border:2px solid var(--text-muted);border-radius:12px;color:var(--text);font-size:0.9rem;margin-bottom:10px;">
                    <input type="text" id="sbKey" placeholder="anon key" style="width:100%;padding:14px;background:var(--bg);border:2px solid var(--text-muted);border-radius:12px;color:var(--text);font-size:0.9rem;margin-bottom:12px;">
                    <button class="btn btn-outline" style="width: 100%;" onclick="saveSupabase()">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
