<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorvix — Voice Agent</title>
    <meta name="theme-color" content="#171717">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#171717;--surface:#1a1a1a;--text:#fafafa;--text2:#b4b4b4;--muted:#898989;--green:#3ecf8e;--green2:#00c573;--border:#242424;--border2:#2e2e2e;--border3:#363636;--r:16px;--rs:8px;--rp:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
        .app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:120px}
        .mono{font-family:'Source Code Pro',monospace}
        
        /* Header */
        .header{padding:24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
        .brand{display:flex;align-items:center;gap:12px}
        .brand-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:1.5rem}
        .brand-text h1{font-size:1.3rem;font-weight:600}
        .brand-text p{font-size:0.75rem;color:var(--muted)}
        
        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px 24px}
        .stat{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:16px 8px;text-align:center}
        .stat-val{font-size:1.8rem;font-weight:600;color:var(--green)}
        .stat-lbl{font-size:0.65rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
        
        /* Section */
        .section{padding:0 24px 24px}
        .section-header{font-size:0.9rem;font-weight:500;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:var(--text2)}
        
        /* Lead Card */
        .lead{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
        .lead:hover{border-color:var(--border3)}
        .lead-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
        .lead-name{font-weight:500;font-size:0.95rem}
        .lead-meta{font-size:0.75rem;color:var(--muted);margin-top:3px}
        .lead-phone{font-size:0.8rem;color:var(--muted);margin-bottom:12px}
        
        .badge{padding:4px 12px;border-radius:var(--rp);font-size:0.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
        .badge-pending{background:rgba(245,158,11,.1);color:#fbbf24}
        .badge-reached{background:rgba(62,207,142,.1);color:var(--green)}
        .badge-calling{background:rgba(99,102,241,.1);color:#60a5fa}
        
        .lead-actions{display:flex;gap:8px}
        
        /* Buttons */
        .btn{padding:10px 18px;border-radius:var(--rs);font-weight:500;font-size:.8rem;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;text-decoration:none;font-family:inherit}
        .btn:active{transform:scale(.95)}
        .btn-primary{background:#0f0f0f;color:var(--text);border:1px solid var(--text);border-radius:var(--rp)}
        .btn-wa{background:#25d366;color:#fff}
        .btn-call{background:var(--green);color:#0f0f0f}
        .btn-outline{background:0 0;color:var(--muted);border:1px solid var(--border2)}
        .btn-outline:hover{border-color:var(--border3);color:var(--text)}
        .btn-sm{padding:8px 14px;font-size:.75rem}
        
        /* FAB */
        .fab{position:fixed;bottom:100px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));color:#0f0f0f;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;z-index:100;border:none}
        
        /* Nav */
        .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(23,23,23,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:14px 0;padding-bottom:max(14px,env(safe-area-inset-bottom));z-index:100}
        .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:500}
        .nav a.active{color:var(--green)}
        .nav-icon{font-size:1.3rem}
        
        /* Toast */
        .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:#0f0f0f;padding:14px 28px;border-radius:var(--rp);font-weight:600;font-size:.9rem;z-index:300;transition:transform .3s}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.err{background:#dc2626;color:#fff}
        
        /* Empty */
        .empty{text-align:center;padding:70px 24px;color:var(--muted)}
        .empty-icon{font-size:4rem;margin-bottom:16px}
        
        /* Install Banner */
        .install-banner{background:linear-gradient(135deg,var(--green),var(--green2));padding:14px 24px;display:none;align-items:center;justify-content:space-between}
        .install-banner-text{font-size:.85rem;font-weight:600;color:#0f0f0f}
        .install-banner-btn{background:rgba(0,0,0,.2);color:#0f0f0f;border:none;padding:8px 16px;border-radius:var(--rp);font-weight:600;font-size:.8rem}
    </style>
</head>
<body>
    <div class="install-banner" id="installBanner">
        <span class="install-banner-text">Install Zorvix App</span>
        <button class="install-banner-btn" id="installBtn">Install</button>
    </div>
    
    <div class="app">
        <div class="header">
            <div class="brand">
                <div class="brand-icon">🎙️</div>
                <div class="brand-text">
                    <h1>Zorvix</h1>
                    <p>AI Voice Agent</p>
                </div>
            </div>
            <div id="connStatus" style="font-size:.75rem;color:var(--muted)" class="mono">CHECKING</div>
        </div>
        
        <div class="stats">
            <div class="stat"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl mono">Leads</div></div>
            <div class="stat"><div class="stat-val" id="sPending">0</div><div class="stat-lbl mono">Pending</div></div>
            <div class="stat"><div class="stat-val" id="sReached">0</div><div class="stat-lbl mono">Reached</div></div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span>Leads</span>
                <button class="btn btn-outline btn-sm" id="autoCallBtn">▶ Auto Call</button>
            </div>
            <div id="leadsList"></div>
        </div>
    </div>
    
    <div class="fab" id="fabBtn">+</div>
    
    <div class="nav">
        <a href="#" class="active"><span class="nav-icon">📞</span>Calls</a>
        <a href="#" onclick="openUpload();return false"><span class="nav-icon">➕</span>Add</a>
        <a href="#" onclick="exportReport();return false"><span class="nav-icon">📊</span>Reports</a>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
    var SUPABASE_URL = "https://bgnmpbnekzhwssyfjdwg.supabase.co";
    var SUPABASE_KEY = "sb_publishable_9hmtvzm0pUcDCSkBiGE8iQ_uxHKzt2x";
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var leads = [];
    var deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var b = document.getElementById('installBanner');
      if (b) b.style.display = 'flex';
    });
    
    var installBtn = document.getElementById('installBtn');
    if (installBtn) {
      installBtn.addEventListener('click', function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() {
            document.getElementById('installBanner').style.display = 'none';
          });
        }
      });
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      loadLeads();
      setInterval(loadLeads, 5000);
    });
    
    function loadLeads() {
      var statusEl = document.getElementById('connStatus');
      var listEl = document.getElementById('leadsList');
      
      supabase.from('leads').select('*').order('created_at', { ascending: false }).then(function(result) {
        var data = result.data;
        var error = result.error;
        
        if (error) {
          console.error('Supabase error:', error);
          if (statusEl) statusEl.textContent = 'ERROR';
          if (listEl) listEl.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><p style="color:#f87171;font-weight:600">' + error.message.slice(0, 80) + '</p></div>';
          return;
        }
        
        leads = data || [];
        if (statusEl) statusEl.textContent = leads.length + ' LEADS';
        renderLeads();
        updateStats();
      }).catch(function(e) {
        console.error('Exception:', e);
        if (statusEl) statusEl.textContent = 'OFFLINE';
        if (listEl) listEl.innerHTML = '<div class="empty"><div class="empty-icon">📡</div><p>' + e.message.slice(0, 60) + '</p></div>';
      });
    }
    
    function updateStats() {
      var total = leads.length;
      var pending = 0;
      var reached = 0;
      for (var i = 0; i < leads.length; i++) {
        if (leads[i].status === 'pending') pending++;
        if (leads[i].status === 'reached' || leads[i].status === 'interested') reached++;
      }
      document.getElementById('sTotal').textContent = total;
      document.getElementById('sPending').textContent = pending;
      document.getElementById('sReached').textContent = reached;
    }
    
    function renderLeads() {
      var c = document.getElementById('leadsList');
      if (!leads.length) {
        c.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No leads yet</p><p style="font-size:.75rem;margin-top:6px">Tap + to upload CSV</p></div>';
        return;
      }
      var html = '';
      for (var i = 0; i < leads.length; i++) {
        var l = leads[i];
        html += '<div class="lead" onclick="openDetail(\'' + l.id + '\')">' +
          '<div class="lead-top"><div><div class="lead-name">' + l.name + '</div><div class="lead-meta">' + (l.business_name || '') + (l.city ? ' • ' + l.city : '') + '</div></div>' +
          '<span class="badge badge-' + l.status + '">' + l.status + '</span></div>' +
          '<div class="lead-phone mono">📱 ' + l.phone + '</div>' +
          '<div class="lead-actions" onclick="event.stopPropagation()">' +
          '<a href="tel:' + l.phone + '" class="btn btn-call btn-sm">📞 Call</a>' +
          '<a href="https://wa.me/' + l.phone.replace('+', '') + '?text=Hi ' + l.name + '! Main Zorvix se call kar raha hoon." target="_blank" class="btn btn-wa btn-sm" onclick="markReached(\'' + l.id + '\')">💬 WhatsApp</a>' +
          '<button class="btn btn-outline btn-sm" onclick="genSite(\'' + l.id + '\')">🌐 Site</button>' +
          '</div></div>';
      }
      c.innerHTML = html;
    }
    
    function markReached(id) {
      supabase.from('leads').update({ status: 'reached' }).eq('id', id).then(function() {});
    }
    
    function genSite(id) {
      var lead = null;
      for (var i = 0; i < leads.length; i++) {
        if (leads[i].id === id) { lead = leads[i]; break; }
      }
      if (!lead) return;
      var svc = lead.service ? lead.service.split(',').map(function(s) { return s.trim(); }) : ['Quality Services'];
      var svcHtml = '';
      for (var j = 0; j < svc.length; j++) {
        svcHtml += '<div class="sc"><div style="font-size:2rem">⭐</div><h3>' + svc[j] + '</h3></div>';
      }
      var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + (lead.business_name || lead.name) + '</title><style>body{font-family:Inter,sans-serif;margin:0;background:#f8fafc;color:#1e293b}.n{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgb(0 0 0 / .1)}.lo{font-size:1.3rem;font-weight:700;color:#3ecf8e;text-decoration:none}.ct{background:#3ecf8e;color:#0f0f0f;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:600}.h{background:linear-gradient(135deg,#3ecf8e,#00c573);color:#0f0f0f;padding:80px 24px;text-align:center}.h h1{font-size:2.2rem;margin-bottom:12px}.t{font-size:1.1rem;opacity:.9;max-width:500px;margin:0 auto 28px}.b{background:#0f0f0f;color:#3ecf8e;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600}.s{padding:60px 24px}.s h2{text-align:center;font-size:1.6rem;margin-bottom:32px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:900px;margin:0 auto}.sc{background:#fff;padding:24px;border-radius:8px;text-align:center;border:1px solid #e2e8f0}.cn{padding:60px 24px;text-align:center}.cn p{margin:8px 0;font-size:1rem}.f{background:#1e293b;color:#94a3b8;text-align:center;padding:24px 0;font-size:.85rem}</style></head><body><nav class="n"><a href="#" class="lo">' + (lead.business_name || lead.name) + '</a><a href="tel:' + lead.phone + '" class="ct">📞 Call Now</a></nav><header class="h"><h1>Welcome to ' + (lead.business_name || lead.name) + '</h1><p class="t">' + svc.join(', ') + ' in ' + (lead.city || 'your area') + '</p><a href="tel:' + lead.phone + '" class="b">📞 Call Us Now</a></header><section class="s"><h2>Our Services</h2><div class="g">' + svcHtml + '</div></section><section class="cn"><h2>Contact</h2>' + (lead.name ? '<p><strong>Owner:</strong> ' + lead.name + '</p>' : '') + '<p><strong>Phone:</strong> <a href="tel:' + lead.phone + '">' + lead.phone + '</a></p>' + (lead.city ? '<p><strong>Location:</strong> ' + lead.city + '</p>' : '') + '</section><footer class="f"><p>© ' + new Date().getFullYear() + ' ' + (lead.business_name || lead.name) + '. Powered by Zorvix</p></footer></body></html>';
      var blob = new Blob([html], { type: 'text/html' });
      window.open(URL.createObjectURL(blob), '_blank');
      toast('✅ Site opened!');
    }
    
    function openDetail(id) {
      var lead = null;
      for (var i = 0; i < leads.length; i++) {
        if (leads[i].id === id) { lead = leads[i]; break; }
      }
      if (!lead) return;
      var msg = prompt('Message for ' + lead.name + '?', 'Hi ' + lead.name + '! Aapki website ban gayi hai!');
      if (msg) {
        window.open('https://wa.me/' + lead.phone.replace('+', '') + '?text=' + encodeURIComponent(msg), '_blank');
        markReached(id);
      }
    }
    
    function autoCall() {
      var pending = leads.filter(function(l) { return l.status === 'pending'; });
      if (!pending.length) return toast('No pending leads', true);
      if (!confirm('Call ' + Math.min(5, pending.length) + ' leads?')) return;
      for (var i = 0; i < Math.min(5, pending.length); i++) {
        supabase.from('leads').update({ status: 'calling' }).eq('id', pending[i].id).then(function() {});
      }
      toast('📞 Calls queued');
      setTimeout(loadLeads, 1000);
    }
    
    function openUpload() {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv';
      input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(evt) {
          var text = evt.target.result;
          var lines = text.split('\n').filter(function(l) { return l.trim(); });
          if (lines.length < 2) return toast('Invalid CSV', true);
          var rows = [];
          for (var i = 1; i < lines.length; i++) {
            var v = lines[i].split(',').map(function(x) { return x.trim(); });
            if (v[0] && v[1]) {
              rows.push({ name: v[0], phone: v[1].replace(/[\s\-\(\)]/g, ''), business_name: v[2] || '', city: v[3] || '', service: v[4] || '' });
            }
          }
          supabase.from('leads').insert(rows).then(function(result) {
            if (result.error) return toast('Upload failed: ' + result.error.message, true);
            toast('✅ ' + rows.length + ' leads added');
            closeModal('uploadModal');
            loadLeads();
          });
        };
        reader.readAsText(file);
      };
      input.click();
    }
    
    function exportReport() {
      var h = ['Name', 'Phone', 'Business', 'City', 'Service', 'Status'];
      var r = leads.map(function(l) {
        return [l.name, l.phone, l.business_name, l.city, l.service, l.status].map(function(c) { return '"' + (c || '') + '"'; }).join(',');
      });
      var csv = [h.join(','), r.join('\n')].join('\n');
      var a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'zorvix_report.csv';
      a.click();
      toast('📥 Downloaded');
    }
    
    function closeModal(id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('show');
    }
    
    function toast(msg, err) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (err ? ' err' : '');
      setTimeout(function() { t.className = 'toast'; }, 2500);
    }
    
    var autoCallBtn = document.getElementById('autoCallBtn');
    if (autoCallBtn) autoCallBtn.onclick = autoCall;
    
    var fabBtn = document.getElementById('fabBtn');
    if (fabBtn) fabBtn.onclick = openUpload;
    </script>
</body>
</html>
